name: SCMS tests

# Avoid overlapping branch runs repeatedly pulling PostgreSQL images and exhausting registry quota.
concurrency:
  group: scmsv12-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: '0 20 * * *'

jobs:
  frontend:
    name: Frontend syntax + regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Run dependency security audit
        run: npm audit --audit-level=high
      - name: Run frontend syntax and regression tests
        run: npm test

  web-session-logout-runtime:
    name: Web session logout RPC runtime test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scms_logout_test
          POSTGRES_PASSWORD: scms_logout_test
          POSTGRES_DB: scms_logout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scms_logout_test -d scms_logout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: scms_logout_test
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U scms_logout_test -d scms_logout_test && exit 0
            sleep 1
          done
          exit 1
      - name: Run isolated web session logout runtime harness
        env:
          PGPASSWORD: scms_logout_test
        run: psql -h 127.0.0.1 -U scms_logout_test -d scms_logout_test -v ON_ERROR_STOP=1 -f test/db/web_session_logout_runtime_test.sql

