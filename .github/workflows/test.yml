name: SCMS tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: '0 20 * * *'

jobs:
  frontend:
    name: Frontend syntax + regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Run dependency security audit
        run: npm audit --audit-level=high
      - name: Run frontend syntax and regression tests
        run: npm test

  website-rls:
    name: Public website RLS runtime test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Public ECR mirror avoids Docker Hub anonymous pull throttling in CI.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: scms_test
          POSTGRES_PASSWORD: scms_test
          POSTGRES_DB: scms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scms_test -d scms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: scms_test
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U scms_test -d scms_test && exit 0
            sleep 1
          done
          exit 1
      - name: Run public website RLS runtime harness
        env:
          PGPASSWORD: scms_test
        run: psql -h 127.0.0.1 -U scms_test -d scms_test -v ON_ERROR_STOP=1 -f school-website/db/sandbox_rls_runtime_test.sql

  playwright-ci:
    name: Playwright local smoke test (automatic PR/push)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start SCMS locally
        run: |
          npm run serve > /tmp/scms-serve.log 2>&1 &
          echo $! > /tmp/scms-serve.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scms-serve.log
          exit 1
      - name: Run local Playwright smoke test
        env:
          SCMS_URL: http://127.0.0.1:5173
        run: npx playwright test test/e2e/ci-smoke.spec.js test/e2e/staff-chat-functions.spec.js
      - name: Write CI summary
        if: always()
        shell: bash
        run: |
          {
            echo '## SCMS Playwright CI'
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Ref: $GITHUB_REF"
            echo "- Job result: ${{ job.status }}"
            echo '- Scope: homepage/page-shell smoke plus mocked Staff Smart Chat UI function flows; real backend integration, authorization, and security remain untested.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright (scheduled/manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      SCMS_STAGING_URL: ${{ secrets.SCMS_STAGING_URL }}
      SCMS_TEST_TEACHER: ${{ secrets.SCMS_TEST_TEACHER }}
      SCMS_TEST_PW: ${{ secrets.SCMS_TEST_PW }}
      SCMS_TEST_TEACHER_2: ${{ secrets.SCMS_TEST_TEACHER_2 }}
      SCMS_TEST_PW_2: ${{ secrets.SCMS_TEST_PW_2 }}
      SCMS_TEST_DEPARTMENT_ID: ${{ secrets.SCMS_TEST_DEPARTMENT_ID }}
      SCMS_TEST_QR_TOKEN: ${{ secrets.SCMS_TEST_QR_TOKEN }}
    steps:
      - name: Verify staging credentials are configured
        id: staging_gate
        shell: bash
        run: |
          if [ -z "$SCMS_STAGING_URL" ] || [ -z "$SCMS_TEST_TEACHER" ] || [ -z "$SCMS_TEST_PW" ]; then
            echo "Staging E2E skipped: required staging secrets are not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.staging_gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.staging_gate.outputs.enabled == 'true'
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        if: steps.staging_gate.outputs.enabled == 'true'
      - name: Run dependency security audit
        if: steps.staging_gate.outputs.enabled == 'true'
        run: npm audit --audit-level=high
      - name: Run frontend syntax and regression tests
        if: steps.staging_gate.outputs.enabled == 'true'
        run: npm test
      - run: npx playwright install --with-deps chromium
        if: steps.staging_gate.outputs.enabled == 'true'
      - name: Run e2e smoke tests against staging
        if: steps.staging_gate.outputs.enabled == 'true'
        env:
          SCMS_URL: ${{ secrets.SCMS_STAGING_URL }}
          SCMS_TEST_TEACHER: ${{ secrets.SCMS_TEST_TEACHER }}
          SCMS_TEST_PW: ${{ secrets.SCMS_TEST_PW }}
          SCMS_TEST_TEACHER_2: ${{ secrets.SCMS_TEST_TEACHER_2 }}
          SCMS_TEST_PW_2: ${{ secrets.SCMS_TEST_PW_2 }}
          SCMS_TEST_DEPARTMENT_ID: ${{ secrets.SCMS_TEST_DEPARTMENT_ID }}
          SCMS_TEST_QR_TOKEN: ${{ secrets.SCMS_TEST_QR_TOKEN }}
          SCMS_REQUIRE_STAGING: '1'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure() && steps.staging_gate.outputs.enabled == 'true'
        with:
          name: playwright-report
          path: playwright-report/
