  playwright-ci:
    name: Playwright local smoke test (automatic PR/push)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start SCMS locally
        run: |
          npm run serve > /tmp/scms-serve.log 2>&1 &
          echo $! > /tmp/scms-serve.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/scms-serve.log
          exit 1
      - name: Run local Playwright smoke, Staff Chat, and Manage Teacher/Access tests
        env:
          SCMS_URL: http://127.0.0.1:5173
        run: npx playwright test test/e2e/ci-smoke.spec.js test/e2e/school-website-studio.spec.js test/e2e/staff-chat-functions.spec.js test/e2e/teacher-management-functions.spec.js
      - name: Write CI summary
        if: always()
        shell: bash
        run: |
          {
            echo '## SCMS Playwright CI'
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Ref: $GITHUB_REF"
            echo "- Job result: ${{ job.status }}"
            echo '- Scope: homepage/page-shell smoke plus mocked Staff Smart Chat and Manage Teacher/Access UI function flows; real backend integration, authorization, and security remain untested.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-local-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright (scheduled/manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      SCMS_STAGING_URL: ${{ secrets.SCMS_STAGING_URL }}
      SCMS_TEST_TEACHER: ${{ secrets.SCMS_TEST_TEACHER }}
      SCMS_TEST_PW: ${{ secrets.SCMS_TEST_PW }}
      SCMS_TEST_TEACHER_2: ${{ secrets.SCMS_TEST_TEACHER_2 }}
      SCMS_TEST_PW_2: ${{ secrets.SCMS_TEST_PW_2 }}
      SCMS_TEST_DEPARTMENT_ID: ${{ secrets.SCMS_TEST_DEPARTMENT_ID }}
      SCMS_TEST_QR_TOKEN: ${{ secrets.SCMS_TEST_QR_TOKEN }}
    steps:
      - name: Verify staging credentials are configured
        id: staging_gate
        shell: bash
        run: |
          if [ -z "$SCMS_STAGING_URL" ] || [ -z "$SCMS_TEST_TEACHER" ] || [ -z "$SCMS_TEST_PW" ] || [ -z "$SCMS_TEST_TEACHER_2" ] || [ -z "$SCMS_TEST_PW_2" ]; then
            echo "Staging E2E BLOCKED: required staging secrets are not configured."
            {
              echo "## Staging E2E readiness: BLOCKED"
              echo "- Required secrets: SCMS_STAGING_URL, SCMS_TEST_TEACHER, SCMS_TEST_PW, SCMS_TEST_TEACHER_2, SCMS_TEST_PW_2."
              echo "- No staging tests ran. A skipped job is not a production-readiness pass."
              echo "- Both isolated staging test accounts are mandatory; seed them in separate schools to validate tenant isolation. Add required optional fixtures, then rerun this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Staging E2E readiness: CONFIGURED"
              echo "- Staging URL and both test accounts are configured. Confirm the accounts belong to separate test schools before treating tenant-isolation coverage as valid."
              echo "- Review the Playwright test report for skipped tests and backend coverage before declaring production readiness."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
        if: steps.staging_gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.staging_gate.outputs.enabled == 'true'
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        if: steps.staging_gate.outputs.enabled == 'true'
      - name: Run dependency security audit
        if: steps.staging_gate.outputs.enabled == 'true'
        run: npm audit --audit-level=high
      - name: Run frontend syntax and regression tests
        if: steps.staging_gate.outputs.enabled == 'true'
        run: npm test
      - run: npx playwright install --with-deps chromium
        if: steps.staging_gate.outputs.enabled == 'true'
      - name: Run e2e smoke tests against staging
        if: steps.staging_gate.outputs.enabled == 'true'
        env:
          SCMS_URL: ${{ secrets.SCMS_STAGING_URL }}
          SCMS_TEST_TEACHER: ${{ secrets.SCMS_TEST_TEACHER }}
          SCMS_TEST_PW: ${{ secrets.SCMS_TEST_PW }}
          SCMS_TEST_TEACHER_2: ${{ secrets.SCMS_TEST_TEACHER_2 }}
          SCMS_TEST_PW_2: ${{ secrets.SCMS_TEST_PW_2 }}
          SCMS_TEST_DEPARTMENT_ID: ${{ secrets.SCMS_TEST_DEPARTMENT_ID }}
          SCMS_TEST_QR_TOKEN: ${{ secrets.SCMS_TEST_QR_TOKEN }}
          SCMS_REQUIRE_STAGING: '1'
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure() && steps.staging_gate.outputs.enabled == 'true'
        with:
          name: playwright-report
          path: playwright-report/

