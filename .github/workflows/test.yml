name: SCMS tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: '0 20 * * *' # ~2:30am Yangon time, nightly

jobs:
  frontend:
    name: Frontend syntax + regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Run frontend syntax and regression tests
        run: npm test

  pgtap:
    name: pgTAP (only when migrations are present)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && hashFiles('supabase/migrations/**/*.sql') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Run pgTAP tests
        run: supabase test db
      - name: Stop stack
        if: always()
        run: supabase stop

  e2e:
    name: Playwright (critical flows only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Run frontend syntax and regression tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Run e2e smoke tests against staging
        env:
          SCMS_URL: ${{ secrets.SCMS_STAGING_URL }}
          SCMS_TEST_TEACHER: ${{ secrets.SCMS_TEST_TEACHER }}
          SCMS_TEST_PW: ${{ secrets.SCMS_TEST_PW }}
          SCMS_TEST_QR_TOKEN: ${{ secrets.SCMS_TEST_QR_TOKEN }}
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
