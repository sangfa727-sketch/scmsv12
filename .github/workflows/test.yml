name: SCMS tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: '0 20 * * *'

jobs:
  frontend:
    name: Frontend syntax + regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Run frontend syntax and regression tests
        run: npm test

  e2e:
    name: Playwright (scheduled/manual only)
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && secrets.SCMS_STAGING_URL != '' && secrets.SCMS_TEST_TEACHER != '' && secrets.SCMS_TEST_PW != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Run frontend syntax and regression tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Run e2e smoke tests against staging
        env:
          SCMS_URL: ${{ secrets.SCMS_STAGING_URL }}
          SCMS_TEST_TEACHER: ${{ secrets.SCMS_TEST_TEACHER }}
          SCMS_TEST_PW: ${{ secrets.SCMS_TEST_PW }}
          SCMS_TEST_QR_TOKEN: ${{ secrets.SCMS_TEST_QR_TOKEN }}
          SCMS_REQUIRE_STAGING: '1'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
